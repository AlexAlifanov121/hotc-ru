<script>
window.addEventListener('load',function(){
setTimeout(function(){
var f=document.getElementById('rec649886123');
if(!f)return;
var a=f.querySelectorAll('[class*="tn-elem"]');
for(var i=0;i<a.length;i++){
var at=a[i].querySelector('.tn-atom');
if(at&&at.textContent&&at.textContent.indexOf('Copyright')!==-1){
if(at.textContent.indexOf('ORN')===-1){
at.innerHTML=at.innerHTML.replace('Heart of the City','Heart of the City Properties L.L.C.');
at.innerHTML+='<br>ORN 30550';
}
break;
}
}
var lnks=f.querySelectorAll('a');
var hm=false;
for(var j=0;j<lnks.length;j++){if(lnks[j].textContent.trim().toLowerCase()==='maldives'){hm=true;break;}}
if(!hm){
for(var k=0;k<lnks.length;k++){
if(lnks[k].textContent.trim()==='Contact us'){
var wd=lnks[k].closest('[class*="tn-elem"]');
if(wd){
var me=document.createElement('div');
me.className='t396__elem tn-elem';
var st=wd.getAttribute('style')||'';
var tm=st.match(/top:\s*([\d.]+)px/);
var nt=tm?(parseFloat(tm[1])+22):210;
var lm=st.match(/left:\s*([\d.]+)px/);
var nl=lm?lm[1]:'318';
var zm=st.match(/zoom:\s*([\d.]+)/);
var z=zm?zm[1]:'1.86667';
me.setAttribute('style','position:absolute;top:'+nt+'px;left:'+nl+'px;zoom:'+z+';');
me.innerHTML='<a href="https://maldives.heartestate.ae/" target="_blank" style="color:rgb(201,169,110);font-family:TildaSans,Arial,sans-serif;font-size:9px;text-decoration:none;font-weight:400;line-height:1.55;">Maldives</a>';
wd.parentNode.insertBefore(me,wd.nextSibling);
}
break;
}
}
}
var aa=f.querySelectorAll('.tn-atom');
for(var m=0;m<aa.length;m++){
if(aa[m].textContent&&aa[m].textContent.indexOf('One Central, The Offices 4, WeWork')!==-1){
aa[m].innerHTML=aa[m].innerHTML.replace(/One Central, The Offices 4, WeWork[^<]*/g,'One Central, The Offices 4, 8th floor, Dubai World Trade Centre');
}
}
},500);
});
